# Render blueprint — ExitTrace worker + public demo target.
# Deploy: dashboard.render.com → New → Blueprint → connect Reski440/exittrace.
# WARNING: the free plan is 512 MB RAM, below Playwright's recommended
# minimum (1 GB). Chromium may OOM on the free tier. For a stable worker,
# use the Starter plan (512 MB, $7/mo — still tight) or Standard (2 GB,
# $25/mo), or Railway's trial (1 GB during trial). See README.
# The demo service is a plain Express app and runs fine on the free plan.
services:
  - type: web
    name: exittrace-worker
    env: docker
    dockerfilePath: ./worker/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WORKER_TOKEN
        generateValue: true
      - key: WORKER_ALLOW_LOCAL_TARGETS
        value: "false"
      # PORT is set automatically by Render; worker/server.ts reads it.
  - type: web
    name: exittrace-demo
    env: node
    buildCommand: npm install
    startCommand: node demo/server.js
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Render sets PORT automatically; demo/server.js reads it.
